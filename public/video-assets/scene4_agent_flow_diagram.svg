<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&amp;family=JetBrains+Mono:wght@600&amp;display=swap');
      .node-title { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; fill: #0A192F; }
      .node-sub { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; fill: #64748B; }
      .callout-title { font-family: 'Inter', sans-serif; font-size: 38px; font-weight: 800; fill: #0A192F; letter-spacing: -0.02em; }
      .callout-badge { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; fill: #0052CC; letter-spacing: 0.1em; text-transform: uppercase; }
      .code-tag { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; fill: #0E6245; }
    </style>
    <filter id="diagramShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#0A192F" flood-opacity="0.14" />
    </filter>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052CC" />
      <stop offset="50%" stop-color="#009CDE" />
      <stop offset="100%" stop-color="#0E6245" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0052CC" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0E6245" />
    </marker>
  </defs>

  <!-- 
    TOP EXPLANATORY OVERLAY BANNER
    BUYER AGENT ───→ MERCHANT POLICY ───→ NEGOTIATED OFFER
  -->
  <g transform="translate(190, 60)" filter="url(#diagramShadow)">
    <!-- Base card container -->
    <rect width="1540" height="130" rx="20" fill="#FFFFFF" fill-opacity="0.97" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Connector lines with animated dashes -->
    <line x1="430" y1="65" x2="610" y2="65" stroke="#0052CC" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow)" />
    <line x1="970" y1="65" x2="1140" y2="65" stroke="#0E6245" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrowGreen)" />

    <!-- NODE 1: BUYER AGENT -->
    <g transform="translate(70, 25)">
      <rect width="340" height="80" rx="14" fill="#F0F5FF" stroke="#0052CC" stroke-width="1.5" />
      <circle cx="44" cy="40" r="18" fill="#0052CC" />
      <!-- Minimalist user / agent icon -->
      <path d="M 38 48 C 38 43 41 41 44 41 C 47 41 50 43 50 48 Z" fill="#FFFFFF" />
      <circle cx="44" cy="35" r="5" fill="#FFFFFF" />
      <text x="76" y="38" class="node-title">BUYER AGENT</text>
      <text x="76" y="56" class="node-sub">Private Ceiling: $760.00 Max</text>
    </g>

    <!-- NODE 2: MERCHANT POLICY -->
    <g transform="translate(630, 25)">
      <rect width="320" height="80" rx="14" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" />
      <circle cx="44" cy="40" r="18" fill="#475569" />
      <!-- Scale / Policy balance icon -->
      <path d="M 36 40 L 52 40 M 44 32 L 44 48 M 38 46 L 50 46" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <text x="76" y="38" class="node-title">MERCHANT POLICY</text>
      <text x="76" y="56" class="node-sub">Floor: $730.00 • Max Disc 12%</text>
    </g>

    <!-- NODE 3: NEGOTIATED OFFER -->
    <g transform="translate(1160, 25)">
      <rect width="320" height="80" rx="14" fill="#ECFDF5" stroke="#0E6245" stroke-width="2" />
      <circle cx="44" cy="40" r="18" fill="#0E6245" />
      <!-- Checkmark badge -->
      <path d="M 38 40 L 42 44 L 50 36" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="76" y="38" class="node-title" fill="#0E6245">NEGOTIATED OFFER</text>
      <text x="76" y="56" class="code-tag">Agreed: $750.00 (Save $50)</text>
    </g>
  </g>

  <!-- 
    BOTTOM EDITORIAL OVERLAYS (Used sequentially at 00:20, 00:23, 00:26)
    Each centered in the lower third
  -->
  <g transform="translate(960, 960)" text-anchor="middle" filter="url(#diagramShadow)">
    <!-- Pill backdrop -->
    <rect x="-320" y="-46" width="640" height="72" rx="36" fill="#0A192F" fill-opacity="0.95" stroke="#1E3A5F" stroke-width="1.5" />
    <text y="-14" class="callout-badge" fill="#62B0FF">CORE INVARIANT</text>
    <text y="14" class="callout-title" fill="#FFFFFF" font-size="28">MERCHANT-DEFINED LIMITS</text>
  </g>
</svg>
