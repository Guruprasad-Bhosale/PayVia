<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800&amp;display=swap');
      .header-label { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; fill: #0052CC; letter-spacing: 0.12em; text-transform: uppercase; }
      .pill-headline { font-family: 'Inter', sans-serif; font-size: 34px; font-weight: 800; fill: #0A192F; letter-spacing: -0.02em; }
    </style>
    <filter id="cplaneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0A192F" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Dual Floating Banner at Top Right / Center Top -->
  <g transform="translate(190, 80)" filter="url(#cplaneShadow)">
    <g transform="translate(0, 0)">
      <rect width="720" height="90" rx="18" fill="#FFFFFF" fill-opacity="0.96" stroke="#CBD5E1" stroke-width="1.5" />
      <rect x="0" y="0" width="6" height="90" rx="3" fill="#0052CC" />
      <text x="32" y="32" class="header-label">CONTROL PLANE ARCHITECTURE</text>
      <text x="32" y="66" class="pill-headline">MERCHANTS CONTROL THE RULES.</text>
    </g>

    <g transform="translate(760, 0)">
      <rect width="680" height="90" rx="18" fill="#FFFFFF" fill-opacity="0.96" stroke="#CBD5E1" stroke-width="1.5" />
      <rect x="0" y="0" width="6" height="90" rx="3" fill="#0E6245" />
      <text x="32" y="32" class="header-label" fill="#0E6245">ZERO-TRUST VERIFICATION</text>
      <text x="32" y="66" class="pill-headline">BUYERS CONTROL APPROVAL.</text>
    </g>
  </g>
</svg>
