<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800&amp;display=swap');
      .tag-num { font-family: 'Inter', monospace, sans-serif; font-size: 13px; font-weight: 800; fill: #0052CC; }
      .tag-text { font-family: 'Inter', sans-serif; font-size: 26px; font-weight: 800; fill: #0A192F; letter-spacing: -0.02em; }
      .tag-sub { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; fill: #64748B; }
    </style>
    <filter id="pillShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0A192F" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Group of 3 Floating Editorial Tags positioned at right margin or top right (safe 80% zone) -->
  <g transform="translate(1320, 260)" filter="url(#pillShadow)">
    <!-- Tag 1: YOUR NEEDS -->
    <g transform="translate(0, 0)">
      <rect width="460" height="88" rx="18" fill="#FFFFFF" fill-opacity="0.96" stroke="#E2E8F0" stroke-width="1.5" />
      <circle cx="48" cy="44" r="18" fill="#EBF3FF" />
      <text x="42" y="49" class="tag-num">01</text>
      <text x="82" y="42" class="tag-text">YOUR NEEDS</text>
      <text x="82" y="64" class="tag-sub">Lightweight laptop for college</text>
    </g>

    <!-- Tag 2: YOUR BUDGET -->
    <g transform="translate(0, 110)">
      <rect width="460" height="88" rx="18" fill="#FFFFFF" fill-opacity="0.96" stroke="#0052CC" stroke-width="2" />
      <circle cx="48" cy="44" r="18" fill="#0052CC" />
      <text x="42" y="49" class="tag-num" fill="#FFFFFF">02</text>
      <text x="82" y="42" class="tag-text">YOUR BUDGET</text>
      <text x="82" y="64" class="tag-sub">Strict ceiling: $760.00 (Private)</text>
    </g>

    <!-- Tag 3: YOUR DEADLINE -->
    <g transform="translate(0, 220)">
      <rect width="460" height="88" rx="18" fill="#FFFFFF" fill-opacity="0.96" stroke="#E2E8F0" stroke-width="1.5" />
      <circle cx="48" cy="44" r="18" fill="#EBF3FF" />
      <text x="42" y="49" class="tag-num">03</text>
      <text x="82" y="42" class="tag-text">YOUR DEADLINE</text>
      <text x="82" y="64" class="tag-sub">Delivered within 5 business days</text>
    </g>
  </g>
</svg>
