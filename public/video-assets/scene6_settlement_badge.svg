<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800&amp;display=swap');
      .badge-title { font-family: 'Inter', sans-serif; font-size: 36px; font-weight: 800; fill: #0A192F; letter-spacing: -0.01em; }
      .badge-sub { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; fill: #475569; }
      .paypal-brand { font-family: 'Inter', sans-serif; font-weight: 800; font-style: italic; fill: #003087; }
    </style>
    <filter id="softFloat" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0A192F" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Lower Left Editorial Badge -->
  <g transform="translate(140, 880)" filter="url(#softFloat)">
    <rect width="520" height="96" rx="20" fill="#FFFFFF" fill-opacity="0.96" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="0" y="0" width="6" height="96" rx="3" fill="#003087" />

    <!-- Icon: Verified Shield -->
    <g transform="translate(36, 26)">
      <circle cx="22" cy="22" r="22" fill="#F0F5FF" />
      <path d="M 22 13 L 31 17 C 31 24 27 29 22 31 C 17 29 13 24 13 17 Z" fill="#0052CC" />
      <path d="M 19 22 L 21 24 L 26 19" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <g transform="translate(94, 38)">
      <text y="0" class="badge-title">PAYPAL SETTLEMENT</text>
      <text y="24" class="badge-sub">Orders v2 • Server-Locked Capture</text>
    </g>
  </g>
</svg>
