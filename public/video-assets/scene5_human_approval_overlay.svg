<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&amp;display=swap');
      .subline { font-family: 'Inter', sans-serif; font-size: 32px; font-weight: 700; fill: #64748B; letter-spacing: 0.05em; text-transform: uppercase; }
      .mainline { font-family: 'Inter', sans-serif; font-size: 64px; font-weight: 900; fill: #0052CC; letter-spacing: -0.02em; text-transform: uppercase; }
      .pill { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; fill: #0E6245; letter-spacing: 0.1em; text-transform: uppercase; }
    </style>
    <filter id="approveShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#0A192F" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Centered / Bottom Editorial Card Over Agreement Screen -->
  <g transform="translate(960, 910)" text-anchor="middle" filter="url(#approveShadow)">
    <rect x="-420" y="-85" width="840" height="150" rx="24" fill="#FFFFFF" fill-opacity="0.97" stroke="#CBD5E1" stroke-width="1.5" />
    
    <!-- Top Micro Badge -->
    <g transform="translate(0, -56)">
      <rect x="-120" y="-12" width="240" height="24" rx="12" fill="#ECFDF5" stroke="#0E6245" stroke-opacity="0.3" stroke-width="1" />
      <text y="4" class="pill">ZERO-TRUST HUMAN GATE</text>
    </g>

    <!-- The Dual Punchlines -->
    <text y="-8" class="subline">THE AI NEGOTIATES.</text>
    <text y="48" class="mainline">YOU APPROVE.</text>
  </g>
</svg>
